<svg xmlns="http://www.w3.org/2000/svg" width="720" height="42" viewBox="0 0 720 42" role="img" aria-label="FoodHub analysis focus areas">
  <rect width="720" height="42" rx="8" fill="#0B0D10"/>
  <text x="18" y="27" fill="#A8A296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Focus -</text>
  <text x="88" y="27" fill="#F0A500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <tspan>
      <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.34;0.99;1" dur="9s" repeatCount="indefinite"/>EDA and distributions
    </tspan>
  </text>
  <text x="88" y="27" fill="#F0A500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <tspan opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>weekday vs weekend ops
    </tspan>
  </text>
  <text x="88" y="27" fill="#F0A500" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <tspan opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.71;0.94;0.99;1" dur="9s" repeatCount="indefinite"/>ratings and commission logic
    </tspan>
  </text>
  <rect x="360" y="11" width="8" height="18" rx="1" fill="#E23D28">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>
</svg>
