<svg xmlns="http://www.w3.org/2000/svg" width="680" height="36" viewBox="0 0 680 36" role="img" aria-label="EDA, delivery ops, ratings, commission revenue">
  <style>
    text { font: 600 17px ui-sans-serif, Segoe UI, Ubuntu, Sans-Serif; }
    .label { fill: #8a8478; }
    .a { fill: #f0a500; }
    .cursor { fill: #e23d28; }
  </style>
  <text x="0" y="24" class="label">Focus ·</text>
  <g transform="translate(72,0)">
    <text class="a" y="24">
      <tspan>
        <animate attributeName="opacity" values="1;1;0;0;0;0" keyTimes="0;0.28;0.33;0.34;0.99;1" dur="9s" repeatCount="indefinite"/>EDA &amp; distributions
      </tspan>
    </text>
    <text class="a" y="24">
      <tspan opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>weekday vs weekend ops
      </tspan>
    </text>
    <text class="a" y="24">
      <tspan opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.71;0.94;0.99;1" dur="9s" repeatCount="indefinite"/>ratings &amp; commission logic
      </tspan>
    </text>
    <rect x="248" y="8" width="8" height="18" class="cursor">
      <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
